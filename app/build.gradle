apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.android'

def static buildTime() {
    return new Date().format("yyyyMMddHH", TimeZone.getTimeZone("GMT+08:00"))
}

android {
    compileSdkVersion 33

    defaultConfig {
        applicationId 'com.github.tvbox.tkkkk'
        minSdkVersion 16
        targetSdkVersion 29
        versionCode 1
        versionName '1.9.'.concat(buildTime())
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
        // 你原来的配置不变，只加这个
        packagingOptions {
            pickFirst '**/*.kotlin_module'
            pickFirst '**/*.so'
            pickFirst '**/*.jar'
            exclude 'META-INF/AL2.0'
            exclude 'META-INF/LGPL2.1'
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled false

            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled true

            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    dexOptions {
        javaMaxHeapSize "4g"
        additionalParameters += '--multi-dex'
        additionalParameters += '--set-max-idx-number=48000'
        additionalParameters += '--minimal-main-dex'
    }
    buildFeatures {
        dataBinding = true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.7.20"
    api fileTree(dir: "libs", include: ["*.jar","*.aar"])
    implementation('com.github.thegrizzlylabs:sardine-android:0.5') {
        exclude group: 'com.squareup.okhttp3'
    }
    implementation 'com.github.NanoHttpd.nanohttpd:nanohttpd:nanohttpd-project-2.3.1'
   // implementation 'com.github.NanoHttpd.nanohttpd:nanohttpd:nanohttpd-websocket-2.3.1'
    implementation 'com.google.zxing:core:3.3.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation files('libs/thunder.jar')
    implementation files('libs/commons-lang3-3.12.0.jar')
    implementation 'com.squareup.okhttp3:okhttp:3.12.11'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.3.0'
    implementation 'androidx.room:room-runtime:2.3.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okio:okio:2.8.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.45-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.google.code.gson:gson:2.8.7'
    implementation 'com.squareup.picasso:picasso:2.71828'
    implementation 'me.jessyan:autosize:1.2.1'
    implementation('com.thoughtworks.xstream:xstream:1.4.15') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation 'org.greenrobot:eventbus:3.2.0'
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'xyz.doikki.android.dkplayer:videocache:3.3.7'
    implementation project(":player")
    implementation project(":quickjs")
    implementation 'com.lzy.net:okgo:3.0.4'
    implementation 'com.owen:tv-recyclerview:3.0.0'
    implementation 'com.github.getActivity:XXPermissions:13.6'
    implementation 'org.jsoup:jsoup:1.14.1'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
    implementation 'com.tencent.bugly:crashreport:latest.release' //最新Bugly SDK
    implementation 'com.github.seven332:jcifs:1.3.19'
    implementation 'com.tencent:mmkv:1.2.14'
    implementation 'io.github.idisfkj:android-startup:1.0.7'
    implementation 'com.google.android:flexbox:2.0.1'
    implementation 'com.tencent.bugly:crashreport:4.1.9'
    implementation 'com.blankj:utilcodex:1.31.0'
   // debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.9.1'
    implementation 'io.github.razerdp:BasePopup:3.2.0'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
    configurations {
        all {
            exclude group: 'xpp3', module: 'xpp3'
        }
    }

}
// 👇 全局强制统一 Kotlin 版本（真正解决重复类的核心！！！）
configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.7.20"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.7.20"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.20"
    }
}
android.applicationVariants.all {
    variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == 'debug'){
                output.outputFileName = "tvbox_${android.defaultConfig.versionName}_debug.apk"
            }else if (variant.buildType.name == 'release'){
                output.outputFileName = "HRTV_${android.defaultConfig.versionName}.apk"
            }
        }
}